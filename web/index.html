<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sakina Saifuddin | Data Scientist</title>
<meta name="description" content="Portfolio of Sakina Saifuddin, data scientist at the University of Houston.">
<meta name="theme-color" content="#0d0906">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 fill=%27%230d0906%27/%3E%3Crect x=%273%27 y=%273%27 width=%2710%27 height=%277%27 fill=%27%23e0a04a%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<canvas id="scene" aria-label="Interactive 3D model of Sakina's desk. Use the buttons below or the keys T, I, N and Z to move between areas."></canvas>

<header class="brand">
  <h1>SAKINA SAIFUDDIN</h1>
  <p>DATA SCIENTIST · UNIVERSITY OF HOUSTON</p>
</header>

<aside id="panel" class="panel" role="dialog" aria-labelledby="panel-title" hidden>
  <button class="close" id="panel-close" aria-label="Close panel">ESC</button>
  <p class="eyebrow" id="panel-eyebrow"></p>
  <h2 id="panel-title"></h2>
  <div id="panel-body"></div>
</aside>

<div id="hint" class="hint" aria-hidden="true"></div>

<nav class="bar" aria-label="Scene controls">
  <ul class="keys">
    <li><button data-view="tapes"><kbd>T</kbd> Tapes</button></li>
    <li><button data-view="ibm"><kbd>I</kbd> IBM PC</button></li>
    <li><button data-view="notepad"><kbd>N</kbd> Notepad</button></li>
    <li><button data-view="desk"><kbd>Z</kbd> Zoom desk</button></li>
  </ul>
  <ul class="toggles">
    <li><button id="btn-credits">CREDITS</button></li>
    <li><button id="btn-sound" aria-pressed="false">SOUND OFF</button></li>
    <li><button id="btn-lofi" aria-pressed="false">LO-FI</button></li>
  </ul>
</nav>

<div id="loader" class="loader" role="status">
  <p class="loader-title">SAKINA SAIFUDDIN</p>
  <div class="loader-track"><div id="loader-fill"></div></div>
  <p id="loader-text">LOADING 0%</p>
</div>

<div id="nogl" class="nogl" hidden>
  <p>This site needs WebGL. Enable hardware acceleration or try another browser.</p>
</div>

<div class="scan" aria-hidden="true"></div>
<script type="module" src="main.js?v=10"></script>
</body>
</html>
